{% macro angkor_mark(css_class='angkor-mark') %}
<svg class="{{ css_class }}" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" fill="currentColor" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="prasat" viewBox="0 0 100 200">
      <polygon points="10,200 90,200 90,150 10,150"/>
      <polygon points="20,150 80,150 80,100 20,100"/>
      <polygon points="30,100 70,100 70,60 30,60"/>
      <polygon points="40,60 60,60 50,0"/>
    </symbol>
  </defs>
  <rect x="0" y="250" width="1000" height="10"/>
  <use href="#prasat" transform="translate(60,150) scale(0.55)"/>
  <use href="#prasat" transform="translate(210,104) scale(0.78)"/>
  <use href="#prasat" transform="translate(390,50) scale(1.05)"/>
  <use href="#prasat" transform="translate(590,104) scale(0.78)"/>
  <use href="#prasat" transform="translate(780,150) scale(0.55)"/>
</svg>
{% endmacro %}
